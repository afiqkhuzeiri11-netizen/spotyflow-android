name: Build SpotyFlow APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build SpotyFlow Native APK (Pure White Liquid Glass 120 FPS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Production Release APK
        run: gradle assembleRelease --stacktrace

      - name: Rename Release APK to SpotyFlow.apk
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk SpotyFlow.apk
          ls -lh SpotyFlow.apk

      - name: Upload SpotyFlow.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpotyFlow-Native-APK
          path: SpotyFlow.apk
          retention-days: 30

      - name: Publish / Update GitHub Release (latest-apk)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: SpotyFlow Native v2.0.0
          body: |
            SpotyFlow 100% Native Android (Final v2.0.0-native, Build 4) — Pure White x Full Liquid Glass 120 FPS + Real Water Drops Navbar + 100% Auralys Features.
            - Custom Dynamic Island Pro via AccessibilityService (6 Styles + Live Synced Lyrics + Camera-Cutout Calibration + Live Preview)
            - Full 10-Category Settings, Hardware 5-Band Equalizer & Loudness FX, Skip Silence, Varispeed, Crossfade, Sleep Timer & Music Alarm
            - Full Offline M4A Download Engine (Priority #0 0ms playback), Device MediaStore Audio Scanner, Spotify/YTM Playlist Importer & .json Backup
            - Poster Lagu 3D Depth Effect Studio (100% Offline ML Kit Selfie Segmentation + 4-Layer Pixel-Aligned Depth Sandwich + Manual Refine Brush + Full HD PNG Gallery Save)
            - 5 Dynamic Liquid Glass Home Screen Widgets (1x1, 2x2, 2x4, 4x1, 4x2) + Interactive Widget Settings Live Preview
          files: SpotyFlow.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
