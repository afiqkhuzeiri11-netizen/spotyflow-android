name: Build SpotyFlow APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build SpotyFlow Native APK (Pure White Liquid Glass 120 FPS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Production Release APK
        run: gradle assembleRelease --stacktrace

      - name: Rename Release APK to SpotyFlow.apk
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk SpotyFlow.apk
          ls -lh SpotyFlow.apk

      - name: Upload SpotyFlow.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpotyFlow-Native-APK
          path: SpotyFlow.apk
          retention-days: 30

      - name: Publish / Update GitHub Release (latest-apk)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: SpotyFlow Native v1.1.0
          body: |
            SpotyFlow 100% Native Android (Stage 2) — Pure White x Full Liquid Glass 120 FPS + Real Water Drops Navbar + Fast On-Device Streaming.
            - Media3 ExoPlayer 1.6.1 + 180MB Local Cache + Background MediaSession
            - Direct InnerTube ANDROID_VR + NewPipeExtractor v0.26.0 fallback
            - Full Artist Profile, Full Album/Playlist Detail, Full User Profile, Live Synced Lyrics & Audio/Video Mode
          files: SpotyFlow.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
