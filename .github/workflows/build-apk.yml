name: Build SpotyFlow APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build SpotyFlow Native APK (Pure White Liquid Glass 120 FPS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Production Release APK
        run: gradle assembleRelease --stacktrace

      - name: Rename Release APK to SpotyFlow.apk
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk SpotyFlow.apk
          ls -lh SpotyFlow.apk

      - name: Upload SpotyFlow.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpotyFlow-Native-APK
          path: SpotyFlow.apk
          retention-days: 30

      - name: Publish / Update GitHub Release (latest-apk)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: SpotyFlow Native v2.4.0
          body: |
            SpotyFlow 100% Native Android (v2.4.0-native, Build 8) — YouTube Music Search, Artist Banner HD, Full Album & Track Credits!
            - Live Typing Search Overlay ala YouTube/YouTube Music (Dual-Engine Autocomplete < 200ms + History + Bold Keyword Suggestions + Instant Song/Album/Artist Cards)
            - Super-Complete Search Results (Hero Top Result, 20-100+ Songs, Albums, Artists, Videos, Playlists, Infinite Scroll & Deezer Rescue with 100% Full YouTube/ExoPlayer Playback)
            - 100% Guaranteed HD Artist Banner (YTM all-headers + TheAudioDB Fanart + Deezer XL + Country/Debut/Genre/Bio)
            - Full Album Detail (100% MPREb_ extraction, numbered tracklist, Release Date, Label, Copyright & Download Album)
            - Official Track Credits & Info Sheet (Performers, Composers, Producers, Label, Copyright, Release Date, Genre, BPM, Duration & Active Stream Quality)
          files: SpotyFlow.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
