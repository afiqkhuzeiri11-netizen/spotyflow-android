name: Build SpotyFlow APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build SpotyFlow Native APK (Pure White Liquid Glass 120 FPS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Production Release APK
        run: gradle assembleRelease --stacktrace

      - name: Rename Release APK to SpotyFlow.apk
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk SpotyFlow.apk
          ls -lh SpotyFlow.apk

      - name: Upload SpotyFlow.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpotyFlow-Native-APK
          path: SpotyFlow.apk
          retention-days: 30

      - name: Publish / Update GitHub Release (latest-apk)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: SpotyFlow Native v2.7.0
          body: |
            SpotyFlow 100% Native Android (v2.8.0-native, Build 12) — Auralys-Grade Super-Accurate Object Cutout!
            - Keeps 100% classic Poster Lagu 3D Pro UI (all 3D music cards, 5 Pro Presets, 5 Tabs, Rim Light, Teks 3D, B&W Color-Pop, 2-Finger Pinch/Rotate, Brush Refine & Checkerboard)
            - Upgrades ONLY the background-photo object cutter to Dual-AI Google ML Kit Subject Segmentation (motorcycles, cars, people, pets, dark scenes) + Offline Selfie Fallback + 4-Stage Studio Matte Refinement (1:1 pixel overlay on Layer 3, cards sandwiched in Layer 2!)
            - Keeps YouTube Music Live Search, HD Artist Banner, Full Album, Official Track Credits, Liquid Glass Real Water Drops, Dynamic Island 6 Styles & 5 Home Widgets
          files: SpotyFlow.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
