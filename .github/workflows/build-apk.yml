name: Build SpotyFlow APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build SpotyFlow Native APK (Pure White Liquid Glass 120 FPS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Production Release APK
        run: gradle assembleRelease --stacktrace

      - name: Rename Release APK to SpotyFlow.apk
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk SpotyFlow.apk
          ls -lh SpotyFlow.apk

      - name: Upload SpotyFlow.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpotyFlow-Native-APK
          path: SpotyFlow.apk
          retention-days: 30

      - name: Publish / Update GitHub Release (latest-apk)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: SpotyFlow Native v2.1.0
          body: |
            SpotyFlow 100% Native Android (v2.1.0-native, Build 5) — Poster Lagu 3D Pro Upgrade!
            - Upgrade #1: True Colored Inner Rim Light hugging subject hair, face & shoulders
            - Upgrade #2: Giant Depth Typography behind head (3 fonts + 1-tap lyric line picker)
            - Upgrade #3: Per-card 5-layer Front/Back subject depth layering
            - Upgrade #4: 6 Cinematic Photo Color Filters including viral B&W Color-Pop
            - Upgrade #5: 2-Finger Pinch-to-Zoom & Rotate + 1-Finger Drag on Live Preview
            - Upgrade #6: 5 1-Tap Pro Presets (Mirror Selfie 3D, Color-Pop B&W, Sampul Majalah, Kolase 4 Lagu, Pure White Crystal)
            - Upgrade #7: 4-Layer Optical Glass Water Drops on 3D Music Cards
          files: SpotyFlow.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
