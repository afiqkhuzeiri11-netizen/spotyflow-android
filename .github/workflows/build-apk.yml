name: Build SpotyFlow APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build SpotyFlow Native APK (Pure White Liquid Glass 120 FPS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Production Release APK
        run: gradle assembleRelease --stacktrace

      - name: Rename Release APK to SpotyFlow.apk
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk SpotyFlow.apk
          ls -lh SpotyFlow.apk

      - name: Upload SpotyFlow.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpotyFlow-Native-APK
          path: SpotyFlow.apk
          retention-days: 30

      - name: Publish / Update GitHub Release (latest-apk)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: SpotyFlow Native v2.5.0
          body: |
            SpotyFlow 100% Native Android (v2.5.0-native, Build 9) — Rombak Total Poster Lagu Depth Effect 4-Layer!
            - Strict 4-Layer Behind-Object Depth Stack: 100% SEMUA sampul lagu (1-5 lagu) + teks besar dikunci di Layer 2 DI BELAKANG potongan objek transparan 1:1 (Layer 3)
            - 3-Lapis AI Pemisah Objek Anti-Gagal: Google ML Kit Subject Segmentation (auto-download modul), ML Kit Selfie Segmentation Offline, + slot opsional Clipdrop API Key
            - Matte Edge Refinement 4-Tahap (anti-gerigi, anti-bercak, anti-tembus badan, EXIF-safe upright photo, Cek Potongan checkerboard)
            - Kartu Mini-Player Liquid Glass murni di Layer 4 tanpa thumbnail sampul depan (hanya judul, artis, progress bar adaptif, & ikon Play)
            - Ekspor True 1080x1920 Full HD PNG anti-pecah langsung ke Pictures/SpotyFlow
          files: SpotyFlow.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
