name: Build VeloxTube Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0'

      - name: Install Frontend Dependencies & Build Web Assets
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: |
          npm ci
          npm run build

      - name: Sync Capacitor Android Project
        working-directory: frontend
        run: npx cap sync android

      - name: Build Android APK (Gradle)
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Package VeloxTube.apk
        run: |
          mkdir -p release-artifacts
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/VeloxTube.apk
          ls -lh release-artifacts/VeloxTube.apk

      - name: Upload VeloxTube.apk to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VeloxTube-Android-APK
          path: release-artifacts/VeloxTube.apk
          retention-days: 30

      - name: Publish VeloxTube.apk to GitHub Releases (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: VeloxTube Android Latest
          body: |
            ### VeloxTube Android APK (`com.veloxtube.app`)
            - Streaming adaptif **HLS (`.m3u8`)** & MP4 60 FPS
            - **Floating Miniplayer** otomatis saat menekan tombol Back Android dari Watch Page
            - **Auto-Rotate Landscape + Immersive Fullscreen**
            - **Status Bar** adaptif Dark Mode (`#0F0F0F`) & Light Mode (`#FFFFFF`)
            - Auto-Fallback Demo/Offline Mode aktif saat backend lokal tidak tersambung

            🌐 **Versi Web:** https://spotyflow.vercel.app
          files: release-artifacts/VeloxTube.apk
          make_latest: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
