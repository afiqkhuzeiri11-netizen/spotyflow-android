[package]
name = "veloxtube"
version = "1.0.0"
description = "VeloxTube — High-Performance 60 FPS Video Streaming Desktop App"
authors = ["VeloxTube"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "veloxtube_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
