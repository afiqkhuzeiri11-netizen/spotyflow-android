<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F0F0F" id="vt-theme-color" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="VeloxTube — Streaming video 60 FPS performa tinggi." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <title>VeloxTube</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('vt_theme');
          var root = document.documentElement;
          if (saved === 'light') {
            root.classList.remove('dark');
            root.setAttribute('data-theme', 'light');
            var m = document.getElementById('vt-theme-color');
            if (m) m.setAttribute('content', '#FFFFFF');
          } else {
            root.classList.add('dark');
            root.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
